name: Evil - User Kernel Execute
description: Trying to execute kernel code as user
points: 0.2

required: true

regexlines:
  - '.PID     1. user fault va 0xffff800000100000 ip 0xffff800000100000'
  - 'Incoming INT frame at 0xfffffe7fffffff..'
  - 'INT frame at 0xf.......'
  - ' INT 14: Page Fault \(#PF\)'
  - ' ERR 0x0000000000000015.*'
  - '.PID     1. Freed task with PID 1'

noregexlines:
  - '\[PID     1\] Exiting gracefully with code .*'
