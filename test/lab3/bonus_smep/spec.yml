name: SMEP - Execute User
description: Try to execute user space code.  
points: 0.2

bonus: SMEP_SMAP
should_panic: true

matchlines:
  - '[PID     0] New task with PID 1'
  - 'Kernel page fault at va 0x800052 ip 0x800052'

noregexlines:
  - 'Kernel page fault at va 0x7fffffff....'
  
