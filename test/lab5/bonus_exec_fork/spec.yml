name: Exec - Fork and Replace Process Image
description: Fork a child process and replace the current process image with the embedded hello binary
points: 0.5
bonus: EXEC_ZERO_DEDUP

regexlines:
  - 'Executing embedded hello binary'
  - 'Hello, world!'
  - 'We are number 2!'
  - '.PID     1. Exiting gracefully'
  - '.PID     1. Freed task with PID 1'
  - '.PID     2. Exiting gracefully'
  - '.PID     [12]. Freed task with PID 2'
