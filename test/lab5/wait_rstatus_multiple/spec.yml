name: Wait - Multiple Child Exit Statuses
description: Checks returning multiple child exit statuses
points: 0.25

regexlines:
  - .PID     0. New task with PID 1
  - .PID     1. I\'m testing rstatusmultiple!
  - .PID     1. New task with PID 2
  - .PID     1. New task with PID 3
  - .Parent PID     1. Waiting for child processes to exit...
  - .PID     2. I\'m the first child! Will return 0x70.
  - .PID     2. Exiting gracefully
  - .PID     3. I\'m the second child! Will return 0x71.
  - .PID     3. Exiting gracefully
  - .PID     .. Freed task with PID 3 # We pattern match on the PID too to work with both the bonus and the base schedulers
  - .Parent PID     1. Child with PID 3 exited with status 0x71
  - .PID     .. Freed task with PID 2
  - .Parent PID     1. Child with PID 2 exited with status 0x70
  - .PID     1. Exiting gracefully
  - .PID     1. Freed task with PID 1
