name: OOM Kill
description: The OOM killer kills the task with the largest footprint in memory and swap.
timeout: 180

regexlines:
  - '^\[PID +[0-9]+\] Out of memory: killing task 1 using 131084 KiB$'

matchlines:
  - 'OOM kill test successful.'

noregexlines:
  - 'Out of memory: killing task 2'
  - 'The parent survived!'

---

name: (2 cores)
qemu: -smp 2
