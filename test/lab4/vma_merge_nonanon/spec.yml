name: VMA - Merge with non-anonymous VMAs
description: Verifies that non-anonymous VMAs do merge when their backing memory is exactly consecutive
points: 0.1

regexlines:
  - '0x0000000000804000 - 0x0000000001000000 .---. free'
  - '0x0000000001000000 - 0x0000000001002000 .rw-. nonanon1'
  - '0x0000000001002000 - 0x00007fffffffd000 .---. free'
  - '.PID     1. Exiting gracefully'
  - '.PID     1. Freed task with PID 1'
