name: Syscall - Unmap on the Left
description: Unmapping a page at the start of a larger mapped range
points: 0.1

required: true

regexlines:
  - '0x0000000000804000 - 0x0000000001001000 .---. free'
  - '0x0000000001001000 - 0x0000000001002000 .r--. user'
  - '0x0000000001002000 - 0x00007fffffffd000 .---. free'
  - '.PID     1. Exiting gracefully'
  - '.PID     1. Freed task with PID 1'
